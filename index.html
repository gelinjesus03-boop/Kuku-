<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WhatsApp Ban Checker - Doro</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', sans-serif;
            background: linear-gradient(135deg, #000000 0%, #1a1a1a 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            max-width: 500px;
            width: 100%;
        }

        .card {
            background: #0a0a0a;
            border-radius: 20px;
            padding: 40px 30px;
            box-shadow: 0 20px 60px rgba(255, 0, 0, 0.2);
            text-align: center;
            border: 2px solid #cc0000;
        }

        .logo-img {
            width: 120px;
            height: 120px;
            border-radius: 15px;
            margin: 0 auto 20px;
            object-fit: cover;
            border: 3px solid #cc0000;
            box-shadow: 0 0 20px rgba(255, 0, 0, 0.3);
        }

        h1 {
            color: #cc0000;
            font-size: 28px;
            margin-bottom: 10px;
            text-shadow: 0 0 10px rgba(255, 0, 0, 0.3);
        }

        .subtitle {
            color: #888;
            font-size: 14px;
            margin-bottom: 30px;
        }

        .input-group {
            margin-bottom: 20px;
            text-align: left;
        }

        label {
            display: block;
            color: #cc0000;
            font-weight: 600;
            margin-bottom: 8px;
            font-size: 14px;
        }

        input[type="tel"],
        input[type="password"],
        textarea {
            width: 100%;
            padding: 14px;
            border: 2px solid #cc0000;
            border-radius: 12px;
            font-size: 16px;
            transition: all 0.3s;
            font-family: inherit;
            background: #1a1a1a;
            color: #ffffff;
        }

        input:focus,
        textarea:focus {
            outline: none;
            border-color: #ff3333;
            box-shadow: 0 0 10px rgba(255, 0, 0, 0.3);
        }

        .button-group {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        button {
            flex: 1;
            padding: 14px;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s;
        }

        button:active {
            transform: scale(0.98);
        }

        .check-btn {
            background: linear-gradient(135deg, #cc0000 0%, #ff3333 100%);
            color: white;
            border: 2px solid #cc0000;
        }

        .check-btn:hover {
            box-shadow: 0 0 20px rgba(255, 0, 0, 0.5);
        }

        .admin-btn {
            background: #1a1a1a;
            color: #cc0000;
            border: 2px solid #cc0000;
        }

        .admin-btn:hover {
            background: #cc0000;
            color: #ffffff;
        }

        .result {
            margin-top: 20px;
            padding: 20px;
            border-radius: 12px;
            display: none;
            animation: slideIn 0.3s ease-in-out;
        }

        .result.banned {
            background: #330000;
            border: 2px solid #cc0000;
            color: #ff3333;
        }

        .result.safe {
            background: #001a00;
            border: 2px solid #00cc00;
            color: #00ff00;
        }

        .result h2 {
            font-size: 18px;
            margin-bottom: 10px;
        }

        .result p {
            font-size: 14px;
            margin: 5px 0;
        }

        .admin-panel {
            display: none;
        }

        .tab-buttons {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .tab-btn {
            flex: 1;
            padding: 10px;
            background: #1a1a1a;
            border: 2px solid #cc0000;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            color: #cc0000;
            transition: all 0.3s;
        }

        .tab-btn.active {
            background: linear-gradient(135deg, #cc0000 0%, #ff3333 100%);
            color: white;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .ban-list {
            max-height: 300px;
            overflow-y: auto;
            text-align: left;
        }

        .ban-item {
            background: #1a1a1a;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 8px;
            border-left: 4px solid #cc0000;
            font-size: 13px;
            color: #ffffff;
        }

        .ban-item h3 {
            color: #cc0000;
            margin-bottom: 3px;
        }

        .ban-item p {
            color: #888;
            margin: 2px 0;
        }

        .remove-btn {
            background: #cc0000 !important;
            color: white !important;
            padding: 6px 12px !important;
            font-size: 12px !important;
            margin-top: 8px !important;
            width: 100% !important;
            border: none !important;
        }

        .remove-btn:hover {
            background: #ff3333 !important;
        }

        .message {
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 15px;
            display: none;
            font-size: 14px;
            animation: slideIn 0.3s ease-in-out;
        }

        .message.success {
            background: #001a00;
            border: 2px solid #00cc00;
            color: #00ff00;
            display: block;
        }

        .message.error {
            background: #330000;
            border: 2px solid #cc0000;
            color: #ff3333;
            display: block;
        }

        .empty-state {
            text-align: center;
            color: #666;
            padding: 20px;
        }

        .back-btn {
            background: #1a1a1a !important;
            color: #cc0000 !important;
            margin-top: 10px !important;
            border: 2px solid #cc0000 !important;
        }

        .back-btn:hover {
            background: #cc0000 !important;
            color: #ffffff !important;
        }

        .config-section {
            background: #1a1a1a;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 15px;
            border: 2px solid #cc0000;
            text-align: left;
        }

        .config-section h3 {
            color: #cc0000;
            margin-bottom: 10px;
        }

        .config-section p {
            color: #888;
            font-size: 12px;
            margin-bottom: 10px;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: #1a1a1a;
        }

        ::-webkit-scrollbar-thumb {
            background: #cc0000;
            border-radius: 4px;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- MAIN PAGE -->
        <div class="card" id="mainPage">
            <img src="https://files.catbox.moe/jjhojw.png" alt="Logo" class="logo-img" id="mainLogo">
            <h1>WhatsApp Ban Checker</h1>
            <p class="subtitle">Vérifiez si un numéro est banni</p>

            <div class="input-group">
                <label for="phoneNumber">Numéro WhatsApp</label>
                <input 
                    type="tel" 
                    id="phoneNumber" 
                    placeholder="+56922415788"
                    autocomplete="off"
                >
            </div>

            <div class="button-group">
                <button class="check-btn" onclick="checkBan()">🔍 Vérifier</button>
                <button class="admin-btn" onclick="goToAdmin()">🔐 Admin</button>
            </div>

            <div class="result" id="result"></div>
        </div>

        <!-- ADMIN LOGIN -->
        <div class="card" id="adminLogin" style="display: none;">
            <div style="font-size: 60px; margin-bottom: 20px;">🔐</div>
            <h1>Admin Login</h1>
            <p class="subtitle">Entrez votre mot de passe</p>

            <div class="input-group">
                <input 
                    type="password" 
                    id="adminPassword" 
                    placeholder="Mot de passe"
                    autocomplete="off"
                >
            </div>

            <button class="check-btn" onclick="login()">Connexion</button>
            <button class="admin-btn" onclick="goBack()">← Retour</button>

            <div class="message" id="loginError"></div>
        </div>

        <!-- ADMIN PANEL -->
        <div class="card" id="adminPanel" style="display: none;">
            <h1>⚙️ Panel Admin</h1>

            <div class="tab-buttons">
                <button class="tab-btn active" onclick="switchTab('add')">➕ Ajouter</button>
                <button class="tab-btn" onclick="switchTab('list')">📋 Liste</button>
                <button class="tab-btn" onclick="switchTab('config')">⚙️ Config</button>
            </div>

            <!-- ADD BAN TAB -->
            <div class="tab-content active" id="tab-add">
                <div class="input-group">
                    <label for="banPhoneNumber">Numéro WhatsApp</label>
                    <input 
                        type="tel" 
                        id="banPhoneNumber" 
                        placeholder="+56922415788"
                        autocomplete="off"
                    >
                </div>

                <div class="input-group">
                    <label for="banReason">Raison du ban</label>
                    <textarea 
                        id="banReason" 
                        placeholder="Spam, Harcèlement, etc."
                        rows="3"
                    ></textarea>
                </div>

                <button class="check-btn" onclick="addBan()">✅ Bannir</button>
                <div class="message" id="addMessage"></div>
            </div>

            <!-- LIST BANS TAB -->
            <div class="tab-content" id="tab-list">
                <div class="ban-list" id="banList">
                    <div class="empty-state">Aucun utilisateur banni</div>
                </div>
            </div>

            <!-- CONFIG TAB -->
            <div class="tab-content" id="tab-config">
                <div class="config-section">
                    <h3>📷 Images</h3>
                    <p>Changez les images en collant les URL:</p>
                    <div class="input-group">
                        <label for="logoUrl">URL du Logo Principal</label>
                        <input 
                            type="text" 
                            id="logoUrl" 
                            placeholder="https://files.catbox.moe/jjhojw.png"
                            value="https://files.catbox.moe/jjhojw.png"
                        >
                        <button class="check-btn" style="margin-top: 10px;" onclick="updateLogo()">Mettre à jour</button>
                    </div>
                </div>

                <div class="config-section">
                    <h3>📝 Textes Personnalisés</h3>
                    <div class="input-group">
                        <label for="bannedText">Texte quand BANNI</label>
                        <textarea 
                            id="bannedText" 
                            rows="3"
                        >Fait Doro par ༒𝕻𝕽𝕴𝕹𝕮𝕰 𝖅𝖊𝖗𝖔𝕯𝖊𝖌𝖔𝖎𝖊༒🖤🍷</textarea>
                    </div>

                    <div class="input-group">
                        <label for="safeText">Texte quand PAS BANNI</label>
                        <textarea 
                            id="safeText" 
                            rows="3"
                        >Il n'est pas encore Faire Doro🖤🍷</textarea>
                    </div>

                    <button class="check-btn" onclick="updateTexts()">💾 Enregistrer</button>
                    <div class="message" id="configMessage"></div>
                </div>
            </div>

            <button class="admin-btn back-btn" onclick="logout()">Déconnexion</button>
        </div>
    </div>

    <script>
        let bannedNumbers = [
            { number: '+18352613044', reason: 'Spam', bannedDate: '2024-01-15' }
        ];

        const ADMIN_PASSWORD = 'Killua_3681';
        let isLoggedIn = false;

        let customTexts = {
            banned: 'Fait Doro par ༒𝕻𝕽𝕴𝕹𝕮𝕰 𝖅𝖊𝖗𝖔𝕯𝖊𝖌𝖔𝖎𝖊༒🖤🍷',
            safe: 'Il n\'est pas encore Faire Doro🖤🍷'
        };

        // Load custom texts from localStorage
        function loadCustomTexts() {
            const saved = localStorage.getItem('customTexts');
            if (saved) {
                customTexts = JSON.parse(saved);
                document.getElementById('bannedText').value = customTexts.banned;
                document.getElementById('safeText').value = customTexts.safe;
            }
        }

        // Load banned numbers from localStorage
        function loadBannedNumbers() {
            const saved = localStorage.getItem('bannedNumbers');
            if (saved) {
                bannedNumbers = JSON.parse(saved);
            }
        }

        // Save banned numbers to localStorage
        function saveBannedNumbers() {
            localStorage.setItem('bannedNumbers', JSON.stringify(bannedNumbers));
        }

        function checkBan() {
            const phone = document.getElementById('phoneNumber').value.trim();
            const resultDiv = document.getElementById('result');

            if (!phone) {
                showMessage(resultDiv, 'Entrez un numéro!', 'error');
                return;
            }

            const cleanPhone = phone.replace(/[\s\-()]/g, '');
            const isBanned = bannedNumbers.some(ban => 
                ban.number.replace(/[\s\-()]/g, '') === cleanPhone
            );

            if (isBanned) {
                const ban = bannedNumbers.find(b => 
                    b.number.replace(/[\s\-()]/g, '') === cleanPhone
                );
                resultDiv.innerHTML = `
                    <h2>⛔ ${customTexts.banned}</h2>
                    <p><strong>Raison:</strong> ${ban.reason}</p>
                    <p><strong>Date:</strong> ${ban.bannedDate}</p>
                `;
                resultDiv.className = 'result banned';
            } else {
                resultDiv.innerHTML = `
                    <h2>✅ ${customTexts.safe}</h2>
                `;
                resultDiv.className = 'result safe';
            }

            resultDiv.style.display = 'block';
        }

        function goToAdmin() {
            document.getElementById('mainPage').style.display = 'none';
            document.getElementById('adminLogin').style.display = 'block';
        }

        function goBack() {
            document.getElementById('adminLogin').style.display = 'none';
            document.getElementById('adminPanel').style.display = 'none';
            document.getElementById('mainPage').style.display = 'block';
            document.getElementById('adminPassword').value = '';
        }

        function login() {
            const password = document.getElementById('adminPassword').value;
            const errorDiv = document.getElementById('loginError');

            if (!password) {
                showMessage(errorDiv, 'Entrez votre mot de passe!', 'error');
                return;
            }

            if (password === ADMIN_PASSWORD) {
                isLoggedIn = true;
                loadCustomTexts();
                document.getElementById('adminLogin').style.display = 'none';
                document.getElementById('adminPanel').style.display = 'block';
                refreshBanList();
            } else {
                showMessage(errorDiv, '❌ Mot de passe incorrect!', 'error');
            }
        }

        function addBan() {
            const phone = document.getElementById('banPhoneNumber').value.trim();
            const reason = document.getElementById('banReason').value.trim();
            const messageDiv = document.getElementById('addMessage');

            if (!phone || !reason) {
                showMessage(messageDiv, 'Remplissez tous les champs!', 'error');
                return;
            }

            const cleanPhone = phone.replace(/[\s\-()]/g, '');
            const exists = bannedNumbers.find(b => 
                b.number.replace(/[\s\-()]/g, '') === cleanPhone
            );

            if (exists) {
                showMessage(messageDiv, 'Ce numéro est déjà banni!', 'error');
                return;
            }

            bannedNumbers.push({
                number: phone,
                reason: reason,
                bannedDate: new Date().toLocaleDateString('fr-FR')
            });

            saveBannedNumbers();
            showMessage(messageDiv, '✅ Numéro banni avec succès!', 'success');
            document.getElementById('banPhoneNumber').value = '';
            document.getElementById('banReason').value = '';
            refreshBanList();
        }

        function removeBan(index) {
            if (confirm('Débannir ce numéro?')) {
                bannedNumbers.splice(index, 1);
                saveBannedNumbers();
                refreshBanList();
            }
        }

        function refreshBanList() {
            const banList = document.getElementById('banList');

            if (bannedNumbers.length === 0) {
                banList.innerHTML = '<div class="empty-state">Aucun utilisateur banni</div>';
                return;
            }

            let html = '';
            bannedNumbers.forEach((ban, index) => {
                html += `
                    <div class="ban-item">
                        <h3>📱 ${ban.number}</h3>
                        <p><strong>Raison:</strong> ${ban.reason}</p>
                        <p><strong>Date:</strong> ${ban.bannedDate}</p>
                        <button class="remove-btn" onclick="removeBan(${index})">❌ Débannir</button>
                    </div>
                `;
            });
            banList.innerHTML = html;
        }

        function switchTab(tab) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));

            document.getElementById(`tab-${tab}`).classList.add('active');
            event.target.classList.add('active');

            if (tab === 'list') {
                refreshBanList();
            }
        }

        function updateLogo() {
            const url = document.getElementById('logoUrl').value.trim();
            if (!url) {
                alert('Entrez une URL!');
                return;
            }
            document.getElementById('mainLogo').src = url;
            alert('Logo mis à jour!');
        }

        function updateTexts() {
            const banned = document.getElementById('bannedText').value.trim();
            const safe = document.getElementById('safeText').value.trim();
            const messageDiv = document.getElementById('configMessage');

            if (!banned || !safe) {
                showMessage(messageDiv, 'Remplissez tous les champs!', 'error');
                return;
            }

            customTexts.banned = banned;
            customTexts.safe = safe;
            localStorage.setItem('customTexts', JSON.stringify(customTexts));
            showMessage(messageDiv, '✅ Textes enregistrés!', 'success');
        }

        function logout() {
            isLoggedIn = false;
            document.getElementById('adminPanel').style.display = 'none';
            document.getElementById('mainPage').style.display = 'block';
        }

        function showMessage(element, text, type) {
            element.textContent = text;
            element.className = `message ${type}`;
        }

        document.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                const active = document.activeElement.id;
                if (active === 'phoneNumber') checkBan();
                if (active === 'adminPassword') login();
            }
        });

        // Load data on page load
        window.addEventListener('load', function() {
            loadBannedNumbers();
            loadCustomTexts();
        });
    </script>
</body>
</html>
